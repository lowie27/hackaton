[project]
name = "kb"
version = "0.1.0"
description = "BM25 knowledge retrieval over PostgreSQL (Tectonic Hackathon, SD Worx case)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
vector = ["fastembed>=0.4"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

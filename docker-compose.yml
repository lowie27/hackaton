services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      retries: 15

  # Demo UI + JSON API on http://localhost:8000 (KB_WEB_PORT).
  web:
    build: .
    container_name: hackaton-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      KB_VECTOR_ENABLED: ${KB_WEB_VECTOR_ENABLED:-true}
      KB_RERANK_ENABLED: ${KB_WEB_RERANK_ENABLED:-true}
      KB_SESSION_SECRET: ${KB_SESSION_SECRET:-}
      KB_ADMIN_PASSWORD: ${KB_ADMIN_PASSWORD:-}
      KB_DEMO_LOGIN: ${KB_DEMO_LOGIN:-true}
    ports:
      - "127.0.0.1:${KB_WEB_PORT:-8000}:8000"
    volumes:
      - models:/models
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  models:
